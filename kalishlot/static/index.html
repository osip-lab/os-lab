<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Lab Dashboard</title>
<link rel="stylesheet" href="/vendor/gridstack.min.css">
<link rel="stylesheet" href="/vendor/uPlot.min.css">
<link rel="stylesheet" href="/styles.css">
<script>
  // Apply the saved theme before first paint so ultra-dark never flashes bright.
  try { if (localStorage.getItem('kalishlot-theme') === 'ultra-dark')
          document.documentElement.dataset.theme = 'ultra-dark'; } catch { }
</script>
</head>
<body>
<header>
  <h1>OS Lab Dashboard</h1>
  <button id="add-device" data-key="Shift+A">+ add device</button>
  <span id="server-status" class="status-line"></span>
  <button id="keys-help" data-key="Shift+/" title="keyboard: every key of the focused box and of the page">⌨ keys</button>
  <button id="screenshot" data-key="Shift+S" title="copy what is on screen now (the whole dashboard as you see it) to the clipboard as PNG">screenshot</button>
  <button id="theme-toggle" data-key="Shift+D" title="toggle ultra-dark mode for a dark lab">ultra-dark</button>
</header>
<div class="grid-stack"></div>
<div id="modal-backdrop" hidden>
  <div id="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-choices"></div>
    <button class="modal-cancel" id="modal-cancel">cancel</button>
  </div>
</div>
<script src="/vendor/gridstack-all.js"></script>
<script src="/vendor/uPlot.iife.min.js"></script>
<script src="/vendor/html-to-image.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
